name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices : suffisantes pour typecheck, tests unitaires et build.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck · Lint · Format · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit & component tests
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: End-to-end (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          # `version: latest` résout la release via l'API GitHub : sans jeton,
          # l'appel est anonyme et tombe en « rate limit exceeded » dès que
          # plusieurs workflows démarrent en même temps. L'action prévoit cette
          # entrée exactement pour ça.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,pgadmin-schema-diff,migra,postgres-meta

      - name: Export Supabase keys
        id: supabase
        run: |
          supabase status -o env > supabase.env
          URL=$(grep -E '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')
          KEY=$(grep -E '^PUBLISHABLE_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          if [ -z "$KEY" ]; then KEY=$(grep -E '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"'); fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run e2e
        run: bun run test:e2e
        env:
          E2E: '1'
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
