name: Compte-rendu DB
description: Poste le résultat d'une commande de base de données sur la PR et dans le résumé du run.

inputs:
  pr:
    description: Numéro de PR où poster le commentaire (vide = résumé du run seulement)
    required: false
    default: ''
  command:
    description: Commande exécutée (check, types, pull, plan, push)
    required: true
  status:
    description: Statut du job (success, failure, cancelled)
    required: true
  token:
    description: Jeton GitHub utilisé pour commenter
    required: true

runs:
  using: composite
  steps:
    - name: Publier le compte-rendu
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
        COMMAND: ${{ inputs.command }}
        STATUS: ${{ inputs.status }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        case "$STATUS" in
          success) icon='✅' ;;
          failure) icon='❌' ;;
          *) icon='⚪' ;;
        esac

        report="$RUNNER_TEMP/report.txt"
        comment="$RUNNER_TEMP/comment.md"

        {
          echo "### $icon \`/db $COMMAND\`"
          echo
          echo '<details><summary>Sortie de la commande</summary>'
          echo
          # Clôture sur quatre backticks : la sortie de la CLI peut en contenir trois.
          echo '````console'
          if [ -s "$report" ]; then
            # Couleurs ANSI retirées, identifiants d'éventuelles URL de connexion masqués.
            tail -c 6000 "$report" \
              | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' \
              | sed -E 's#(postgres(ql)?://[^:/@]+:)[^@]+@#\1***@#g'
          else
            echo '(aucune sortie)'
          fi
          echo '````'
          echo
          echo '</details>'
          echo
          echo "[Détail du run]($RUN_URL)"
        } > "$comment"

        cat "$comment" >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$PR" ]; then
          gh pr comment "$PR" --repo "$REPO" --body-file "$comment"
        fi
